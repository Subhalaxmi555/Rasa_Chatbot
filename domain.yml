version: "3.1" 

intents: 
- greet
- start_admission
- inform 
- reset
- goodbye 
- bot_challenge 

entities: 
- name 
- city 
- rank 

slots:
  name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: name
      - type: from_text
        conditions:
          - active_loop: admission_form
            requested_slot: name

  city:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: city
      - type: from_text
        conditions:
          - active_loop: admission_form
            requested_slot: city

  rank:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: rank
      - type: from_text
        conditions:
          - active_loop: admission_form
            requested_slot: rank
 
      
forms: 
 admission_form: 
  required_slots: 
   - name
   - city 
   - rank 
    
responses: 

  utter_greet: 
    - text: "Hey! How are you? " 
   
  
  utter_ask_name: 
    - text: "What is your name?" 
  
  utter_ask_city: 
    - text: "Which city do you live in?" 

  utter_ask_rank: 
    - text: "Please tell me your OJEE rank."  
  
  utter_goodbye: 
    - text: "Goodbye!" 
  
  utter_iamabot: 
    - text: "I am a bot powered by Rasa." 
  
actions: 
- action_say_iit_result
- action_set_rank_from_text
- action_reset_slots